<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Volt — power for small teams</title>
  </head>
  <body>
    <main class="page">
      <h1>Volt — power for small teams</h1>
      <p class="sub">One simple workspace for the work your small team actually does.</p>
      <form id="waitlist" class="form">
        <input id="email" type="email" placeholder="you@company.com" required />
        <button id="join" class="cta" type="submit">Join the waitlist</button>
      </form>
      <p id="counter" class="counter"><span id="count">128</span> people waiting</p>
      <p id="thanks" class="thanks" hidden>Thanks, you're on the list.</p>
    </main>
    <footer class="footer">© 2026 Volt</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoomService · Control Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/hud.css" />
  </head>
  <body>
    <div id="app">
      <header id="top">
        <div class="word"><b>RoomService</b><span>Control Room</span></div>
        <div id="mission">no task</div>
        <div class="right">
          <span id="timer">00:00:00</span>
          <span class="conn" id="c-switch"><i></i>switch</span>
          <span class="conn" id="c-n8n"><i></i>n8n</span>
          <span class="conn" id="c-hands"><i></i>computer</span>
        </div>
      </header>

      <main id="stage">
        <svg id="map" role="img" aria-label="Live map of the Switch room: owner, Switch, agents and the desk"></svg>
        <p id="demo-caption" hidden></p>
        <div id="voice"><span>VOICE</span><h1 id="caption" aria-live="polite"></h1></div>
        <div id="ignite-text">ROOM SERVICE ONLINE</div>

        <div id="approval" hidden>
          <div class="panel">
            <div id="ap-title">APPROVAL NEEDED</div>
            <div id="ap-code">----</div>
            <div id="ap-cmd"></div>
            <div class="bar"><i id="ap-bar"></i></div>
            <div id="ap-left"></div>
            <div id="ap-hint">reply <b>ok CODE</b> or <b>no CODE</b> from your phone</div>
          </div>
        </div>

        <figure id="toast" hidden>
          <img id="toast-img" alt="screenshot from the desk" />
          <figcaption id="toast-cap"></figcaption>
        </figure>
      </main>

      <aside id="feed" aria-label="Activity">
        <h2>Activity</h2>
        <ol id="feed-list"></ol>
      </aside>

      <footer id="strip">
        <span class="label">Computer</span>
        <div id="chips"></div>
        <span class="keys">F full · M mute · S pause · C captions</span>
      </footer>
    </div>

    <div id="flash"></div>
    <div id="transfer" hidden></div>
    <div id="freeze" hidden>Paused · the computer is not executing · press S to resume</div>
    <div id="pill" hidden>reconnecting…</div>

    <script type="module" src="/static/hud.js"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>RoomService architecture</title>
  <desc>Phone to Telegram bridge to Switch (HQ room, mission room, roles and leases) to concierge, builder, scout, desk-laptop, life, relay and HUD on the demo machine, with desk-backup on a second machine and n8n behind life.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2037ff"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="40" y="48" font-size="28" font-weight="700" fill="#111">RoomService: the room has a body, Switch is the spine</text>
  <text x="40" y="76" font-size="16" fill="#555">Blue arrows are Switch messages, operations or WebSocket frames. Nothing reaches the desk any other way.</text>

  <!-- Phone -->
  <rect x="40" y="330" width="210" height="120" rx="12" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="145" y="368" font-size="20" font-weight="700" fill="#111" text-anchor="middle">Phone</text>
  <text x="145" y="394" font-size="15" fill="#444" text-anchor="middle">Wispr Flow dictation</text>
  <text x="145" y="416" font-size="15" fill="#444" text-anchor="middle">Telegram group</text>
  <text x="145" y="436" font-size="15" fill="#444" text-anchor="middle">"RoomService HQ"</text>

  <!-- Telegram bridge -->
  <rect x="310" y="345" width="170" height="90" rx="12" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="395" y="383" font-size="18" font-weight="700" fill="#111" text-anchor="middle">Telegram</text>
  <text x="395" y="406" font-size="18" font-weight="700" fill="#111" text-anchor="middle">bridge</text>
  <text x="395" y="426" font-size="13" fill="#555" text-anchor="middle">one BotFather bot</text>

  <line x1="250" y1="390" x2="308" y2="390" stroke="#2037ff" stroke-width="3" marker-end="url(#a)"/>
  <line x1="480" y1="390" x2="538" y2="390" stroke="#2037ff" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- Switch -->
  <rect x="540" y="100" width="520" height="700" rx="16" fill="#f5f6ff" stroke="#2037ff" stroke-width="3"/>
  <text x="570" y="140" font-size="24" font-weight="700" fill="#2037ff">SWITCH server</text>
  <text x="570" y="164" font-size="14" fill="#555">Docker stack with Mattermost, gateway, agent protocol</text>

  <rect x="570" y="186" width="460" height="130" rx="10" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="590" y="216" font-size="18" font-weight="700" fill="#111">HQ room: roomservice-hq</text>
  <text x="590" y="242" font-size="14" fill="#444">Mattermost room + Telegram room, same crew</text>
  <text x="590" y="264" font-size="14" fill="#444">alias @hands = desk-laptop</text>
  <text x="590" y="286" font-size="14" fill="#444">wake phrase gets ignition; concierge is main agent</text>

  <rect x="570" y="346" width="460" height="130" rx="10" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="590" y="376" font-size="18" font-weight="700" fill="#111">Mission room: mission-&lt;slug&gt;</text>
  <text x="590" y="402" font-size="14" fill="#444">built by run_template (roomservice-mission)</text>
  <text x="590" y="424" font-size="14" fill="#444">brief document, crew, kickoff message</text>
  <text x="590" y="446" font-size="14" fill="#444">linked to HQ both ways (link_rooms)</text>

  <rect x="570" y="506" width="460" height="120" rx="10" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="590" y="536" font-size="18" font-weight="700" fill="#111">Roles and leases</text>
  <text x="590" y="562" font-size="14" fill="#444">role "hands" is exclusive: one holder at a time</text>
  <text x="590" y="584" font-size="14" fill="#444">assume_role / release_role, lease renewed every 3 s</text>
  <text x="590" y="606" font-size="14" fill="#444">lease lapses, the role is free for desk-backup</text>

  <rect x="570" y="656" width="460" height="120" rx="10" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="590" y="686" font-size="18" font-weight="700" fill="#111">Addressing and approvals</text>
  <text x="590" y="712" font-size="14" fill="#444">owner and owner's agents only; others refused</text>
  <text x="590" y="734" font-size="14" fill="#444">media upload, typing indicator, room documents</text>
  <text x="590" y="756" font-size="14" fill="#444">"yes" / "no" answers Console permission prompts</text>

  <!-- Demo machine -->
  <rect x="1130" y="100" width="450" height="560" rx="16" fill="#fff" stroke="#111" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1155" y="132" font-size="18" font-weight="700" fill="#111">Demo machine (Mac)</text>

  <rect x="1155" y="150" width="400" height="130" rx="10" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="1175" y="178" font-size="17" font-weight="700" fill="#111">Console agents (Claude Code)</text>
  <text x="1175" y="204" font-size="14" fill="#444">concierge: plans, runs the template</text>
  <text x="1175" y="226" font-size="14" fill="#444">builder: edits the project, asks hands for proof</text>
  <text x="1175" y="248" font-size="14" fill="#444">scout: finds references (optional)</text>

  <rect x="1155" y="305" width="400" height="215" rx="10" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="1175" y="333" font-size="17" font-weight="700" fill="#111">roomservice up (Python runtime)</text>
  <rect x="1175" y="348" width="170" height="52" rx="8" fill="#f2f2f2" stroke="#555"/>
  <text x="1260" y="371" font-size="14" font-weight="700" fill="#111" text-anchor="middle">desk-laptop</text>
  <text x="1260" y="389" font-size="12" fill="#444" text-anchor="middle">hands: allowlisted OS actions</text>
  <rect x="1365" y="348" width="170" height="52" rx="8" fill="#f2f2f2" stroke="#555"/>
  <text x="1450" y="371" font-size="14" font-weight="700" fill="#111" text-anchor="middle">life</text>
  <text x="1450" y="389" font-size="12" fill="#444" text-anchor="middle">calendar and mail agent</text>
  <rect x="1175" y="416" width="170" height="44" rx="8" fill="#f2f2f2" stroke="#555"/>
  <text x="1260" y="443" font-size="14" font-weight="700" fill="#111" text-anchor="middle">relay (to HQ)</text>
  <rect x="1365" y="416" width="170" height="44" rx="8" fill="#f2f2f2" stroke="#555"/>
  <text x="1450" y="443" font-size="14" font-weight="700" fill="#111" text-anchor="middle">scheduler</text>
  <rect x="1175" y="472" width="340" height="34" rx="8" fill="#f2f2f2" stroke="#555"/>
  <text x="1345" y="494" font-size="14" font-weight="700" fill="#111" text-anchor="middle">HUD  http://127.0.0.1:7777</text>

  <rect x="1155" y="545" width="400" height="90" rx="10" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="1175" y="575" font-size="17" font-weight="700" fill="#111">n8n :5678 (Docker)</text>
  <text x="1175" y="600" font-size="14" fill="#444">workflow "RoomService Life": calendar, mail drafts</text>
  <text x="1175" y="620" font-size="14" fill="#444">no send-email tool</text>

  <!-- Second machine -->
  <rect x="1130" y="700" width="450" height="130" rx="16" fill="#fff" stroke="#111" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1155" y="732" font-size="18" font-weight="700" fill="#111">Second machine</text>
  <rect x="1155" y="745" width="400" height="66" rx="10" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="1175" y="772" font-size="17" font-weight="700" fill="#111">desk-backup (roomservice backup)</text>
  <text x="1175" y="796" font-size="14" fill="#444">takes the hands role when the lease lapses</text>

  <!-- Switch to machines -->
  <line x1="1060" y1="215" x2="1153" y2="215" stroke="#2037ff" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="1095" y="204" font-size="12" fill="#2037ff" text-anchor="middle">Console</text>
  <line x1="1060" y1="420" x2="1153" y2="400" stroke="#2037ff" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="1095" y="444" font-size="12" fill="#2037ff" text-anchor="middle">WS + HTTP</text>
  <line x1="1060" y1="780" x2="1153" y2="780" stroke="#2037ff" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="1095" y="768" font-size="12" fill="#2037ff" text-anchor="middle">WS + HTTP</text>

  <!-- local link -->
  <line x1="1535" y1="374" x2="1545" y2="374" stroke="#555" stroke-width="2"/>
  <line x1="1545" y1="374" x2="1545" y2="543" stroke="#555" stroke-width="2" marker-end="url(#g)" marker-start="url(#g)"/>
  <text x="1538" y="538" font-size="12" fill="#555" text-anchor="end">webhook</text>

  <!-- legend -->
  <line x1="40" y1="560" x2="100" y2="560" stroke="#2037ff" stroke-width="3" marker-end="url(#a)"/>
  <text x="112" y="565" font-size="14" fill="#333">Switch traffic</text>
  <line x1="40" y1="590" x2="100" y2="590" stroke="#555" stroke-width="2" marker-end="url(#g)"/>
  <text x="112" y="595" font-size="14" fill="#333">local link</text>
  <rect x="40" y="610" width="60" height="22" fill="none" stroke="#111" stroke-dasharray="6 4"/>
  <text x="112" y="627" font-size="14" fill="#333">machine boundary</text>
  <text x="40" y="700" font-size="14" fill="#555">Ignition runs on the desk before any model replies:</text>
  <text x="40" y="722" font-size="14" fill="#555">owner wake phrase in HQ, boot profile, voice, HUD.</text>
</svg>

version: 1
params:
  workspace: {type: directory, label: Workspace folder, default: "~/roomservice-workspace"}
  provider:  {type: provider, default: [claude], input: advanced}
  location:  {type: location, default: local, input: advanced}
  bridge:    {type: bridge, default: [Mattermost, $first], input: advanced}
agents:
  - name: concierge
    display_name: Planner
    description: Turns one spoken sentence into a task room, a team and a plan.
    provider: "{provider}"
    location: "{location}"
    directory: "{workspace}/concierge"
    addressing: owner-agents
    auto_mode: true
    instructions: "@@FILE:concierge.md@@"
  - name: builder
    display_name: Builder
    description: Builds the task's project and asks the Computer for proof.
    provider: "{provider}"
    location: "{location}"
    directory: "{workspace}"
    addressing: owner-agents
    auto_mode: true
    instructions: "@@FILE:builder.md@@"
  - name: scout
    display_name: Researcher
    description: Finds references and registers them in the task room.
    provider: "{provider}"
    location: "{location}"
    directory: "{workspace}/scout"
    addressing: owner-agents
    auto_mode: true
    instructions: "@@FILE:scout.md@@"
room:
  name: roomservice-hq
  description: RoomService main chat. Speak a task here.
  bridge: "{bridge}"
  channel_type: channel_public
  instructions: "@@FILE:hq-room.md@@"
  agents: [concierge, builder, scout, desk-laptop, life]
  users: ["{$creator}"]
  aliases:
    planner: concierge
    researcher: scout
    computer: desk-laptop
    assistant: life
    backup: desk-backup
kickoff: "@concierge introduce the team in three short lines and say you're ready for a task."

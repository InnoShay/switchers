[project]
name = "roomservice"
version = "1.0.0"
description = "RoomService: give your room a body with Switch."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Lakshay Sharma" }, { name = "Yash Goel" }]
dependencies = [
    "websockets>=14",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "pyyaml",
    "python-dotenv",
    "typer",
    "rich",
    "mss",
    "Pillow",
    "playwright",
    "fastapi",
    "uvicorn[standard]",
    "apscheduler>=3.10,<4",
]

[project.scripts]
roomservice = "roomservice.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "python-multipart",
    "respx",
    "freezegun",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roomservice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: needs a real Switch server and a filled .env (deselect with -m 'not live')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
exclude = ["*.md"]  # never reformat SPEC.md's code blocks

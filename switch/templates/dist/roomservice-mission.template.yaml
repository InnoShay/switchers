version: 1
params:
  slug:
    type: string
    label: Task slug
    pattern: ^[a-z0-9][a-z0-9-]{2,38}$
  title:
    type: string
    label: Task title
  brief:
    type: string
    label: Spoken brief verbatim
    multiline: true
  project:
    type: string
    label: Project key from desk.yaml or none
    default: none
  bridge:
    type: bridge
    default:
    - Mattermost
    - $first
    input: advanced
room:
  name: task-{slug}
  description: 'RoomService task: {title}'
  bridge: '{bridge}'
  channel_type: channel_public
  instructions: |
    # Task room

    This room exists for one task. The brief is in the document "task-brief".
    The owner may not be watching this room; the main chat mirrors key events to their phone.

    - The Computer is a program holding the `hands` role. Address @computer (or @hands) with
      one grammar command per line. It answers with ✅ / ⛔ / ⏳ / ⚠️ receipts.
    - Risky Computer commands (commit, push, close all, scripts marked confirm) wait for the
      owner's approval code. Never try to approve on the owner's behalf.
    - `@computer status` returns the project path and dev server URL.
    - Time zone: Asia/Kolkata. Never narrate plumbing.
  agents:
  - concierge
  - builder
  - scout
  - desk-laptop
  - life
  users:
  - '{$creator}'
  aliases:
    concierge: planner
    scout: researcher
    desk-laptop: computer
    life: assistant
  roles:
  - name: hands
    exclusive: true
    instructions: 'The body of the room (the Computer): a program that executes the Computer grammar on a real computer. Address @computer (or @hands) with one command per line.'
  docs:
  - name: task-brief
    description: The task as spoken, its slug and project.
    instructions: Read first. Do not edit.
    content: |
      # {title}

      **Spoken brief:** {brief}

      **Task slug:** {slug}
      **Project key:** {project}
kickoff: |
  @desk-laptop task {slug} {project}
  @builder the brief is in this room's documents. Wait for the Planner's plan, then start.
